$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:agent-context:context-map:v1"
title: Addressable map of the directing context
type: object
additionalProperties: false
required: [version, defaults, startup_docs, nodes]
properties:
  version:
    const: 1
  defaults:
    type: object
    additionalProperties: false
    required: [budget_tokens, expansion_depth, max_targets]
    properties:
      budget_tokens:
        type: integer
        minimum: 1000
      expansion_depth:
        type: integer
        minimum: 0
        maximum: 2
      max_targets:
        type: integer
        minimum: 1
        maximum: 5
  startup_docs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/path"
  nodes:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/node"
$defs:
  path:
    type: string
    pattern: "^[A-Za-z0-9_./-]+$"
  node_id:
    type: string
    pattern: "^[a-z0-9][a-z0-9._-]+$"
  refs:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/node_id"
  node:
    type: object
    additionalProperties: false
    required: [id, kind, label, responsibility, docs, triggers]
    properties:
      id:
        $ref: "#/$defs/node_id"
      kind:
        enum: [system, layer, invariant, application, domain, contract]
      status:
        enum: [filled, skeleton]
      label:
        type: string
        minLength: 1
        maxLength: 100
      responsibility:
        type: string
        minLength: 1
        maxLength: 280
      docs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/path"
      code:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/path"
      triggers:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 2
          maxLength: 80
      aliases:
        description: >
          Extra words that NAME this application in a free-form task, beyond the name
          already carried by its node id. The compiler derives its alias table from this
          field; hard-coding it in the code was the one place that knew the fleet.
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 2
          maxLength: 40
      contains:
        $ref: "#/$defs/refs"
      depends_on:
        $ref: "#/$defs/refs"
      constrained_by:
        $ref: "#/$defs/refs"
      producer:
        $ref: "#/$defs/node_id"
      consumers:
        $ref: "#/$defs/refs"
    allOf:
      - if:
          properties:
            kind:
              const: contract
        then:
          required: [producer, consumers]
